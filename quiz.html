<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Glow Formula — Euphoriel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans':    ['DM Sans', 'sans-serif'],
                        'serif':   ['Playfair Display', 'serif'],
                        'display': ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        'brand-green':  '#1F4C35',
                        'brand-light':  '#e8f0e9',
                        'brand-muted':  '#a7b7a4',
                    },
                    letterSpacing: {
                        'ultra-wide': '0.15em',
                    },
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'BrandFont';
            src: url('font.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        html, body { height: 100%; margin: 0; }

        /* Floating entrance animation */
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px) rotate(var(--rot)); }
            to   { opacity: 1; transform: translateY(0)   rotate(var(--rot)); }
        }

        .product-img {
            position: absolute;
            border-radius: 1rem;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(31,76,53,0.18), 0 4px 16px rgba(0,0,0,0.10);
            animation: floatIn 0.9s ease both;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .product-img:hover {
            box-shadow: 0 30px 80px rgba(31,76,53,0.28), 0 8px 24px rgba(0,0,0,0.14);
            z-index: 20 !important;
        }

        /* Subtle continuous float */
        @keyframes drift {
            0%, 100% { transform: translateY(0)   rotate(var(--rot)); }
            50%       { transform: translateY(-8px) rotate(var(--rot)); }
        }
        .product-img { animation: floatIn 0.9s ease both, drift 6s ease-in-out infinite; }

        /* Each card has its own delay so they drift at different phases */
        .img-1 { --rot: -11deg;  animation-delay: 0s,   0.9s; }
        .img-2 { --rot:   7deg;  animation-delay: 0.1s, 1.4s; }
        .img-4 { --rot:  12deg;  animation-delay: 0.2s, 0.5s; }
        .img-6 { --rot:   6deg;  animation-delay: 0.3s, 1.8s; }

        /* Right-panel slide-in */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .slide-up   { animation: slideUp 0.8s ease both; }
        .delay-1    { animation-delay: 0.3s; }
        .delay-2    { animation-delay: 0.55s; }
        .delay-3    { animation-delay: 0.75s; }

        /* Quiz button ripple */
        .quiz-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: rgba(255,255,255,0.2);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .quiz-btn:hover::after { opacity: 1; }
    </style>
</head>

<body class="font-sans bg-white overflow-hidden" style="height:100vh;">

<!-- ══════════════════════════════════════
     QUIZ LOGIC
     ══════════════════════════════════════ -->
<script>
    const questions = [
        {
            q: "How would you describe your skin type?",
            options: [
                { label: "Oily, shiny, or breakout-prone",                scores: { balance: 3 } },
                { label: "Combination — oily in some areas, dry in others", scores: { harmonic: 3 } },
                { label: "Dry, tight, or dehydrated",                     scores: { renewal: 3 } },
                { label: "Mature, with fine lines or loss of firmness",   scores: { timeless: 3 } },
            ]
        },
        {
            q: "What's your biggest skin concern right now?",
            options: [
                { label: "Clogged pores, blackheads, or breakouts",      scores: { balance: 3 } },
                { label: "Uneven texture or dullness",                   scores: { harmonic: 2, renewal: 1 } },
                { label: "Fine lines or loss of firmness",               scores: { timeless: 3 } },
                { label: "Redness, tightness, or stripped-feeling skin", scores: { renewal: 3 } },
            ]
        },
        {
            q: "Right after cleansing, how does your skin feel?",
            options: [
                { label: "Oily again within an hour",                    scores: { balance: 3 } },
                { label: "Tight in some spots, oily in others",          scores: { harmonic: 3 } },
                { label: "Comfortable, just needs more moisture",        scores: { renewal: 3 } },
                { label: "Tight, dry, or irritated",                     scores: { renewal: 3 } },
            ]
        },
        {
            q: "What's the #1 result you want from your skincare routine?",
            options: [
                { label: "Clearer skin and less shine",                  scores: { balance: 3 } },
                { label: "Balance — calm oily zones, hydrate dry zones", scores: { harmonic: 3 } },
                { label: "Firmer, smoother, more youthful-looking skin", scores: { timeless: 3 } },
                { label: "Calm, soothe, and protect sensitive skin",     scores: { renewal: 3 } },
            ]
        },
    ];

    const faceProducts = {
        balance: {
            name: "Balance Elixir",
            tagline: "Oily and blemish-prone skin",
            desc: "Regulates oil, clears pores, and calms your skin without drying it out. Lightweight and fast-absorbing with jojoba, tamanu, and sea buckthorn.",
            img: "Copy_of_Balance_Elixir_Face_Oil-01.png.webp",
            price: "$39.99 CAD",
        },
        harmonic: {
            name: "Harmonic Elixir",
            tagline: "Combination skin",
            desc: "Hydrates where you need it, regulates where you don't. Works on both the oily zones and dry patches at the same time without clogging pores.",
            img: "Copy_of_Harmonic_Elixir_Face_Oil-01.png.webp",
            price: "$39.99 CAD",
        },
        renewal: {
            name: "Renewal Elixir",
            tagline: "Normal to dry skin",
            desc: "Deep hydration without feeling heavy. Rosehip, marula, and vitamin C replenish moisture, even skin tone, and bring back the glow.",
            img: "Copy_of_Renewal_Elixir_Face_Oil-01.png.webp",
            price: "$39.99 CAD",
        },
        timeless: {
            name: "Timeless Elixir",
            tagline: "Mature and aging skin",
            desc: "Firms, smooths, and nourishes skin that has lost some elasticity. Coenzyme Q10, camellia, and vitamin C visibly soften fine lines over time.",
            img: "Copy_of_Timeless_Elixir_Face_Oil-01.webp",
            price: "$39.99 CAD",
        },
    };

    let step    = 0;
    let answers = [];
    let pendingFaceKey = null;

    const overlay      = document.getElementById('quizOverlay');
    const leadOverlay  = document.getElementById('leadOverlay');
    const resultScreen = document.getElementById('resultOverlay');
    const qWrap        = document.getElementById('questionWrap');
    const progressBar  = document.getElementById('progressBar');
    const prevBtn      = document.getElementById('prevBtn');
    const nextBtn      = document.getElementById('nextBtn');

    function showQuestion() {
        const q    = questions[step];
        const saved = answers[step];
        progressBar.style.width      = ((step + 1) / questions.length * 100) + '%';
        prevBtn.style.visibility     = step === 0 ? 'hidden' : 'visible';
        nextBtn.textContent          = step === questions.length - 1 ? 'See My Match' : 'Next';

        qWrap.innerHTML = `
            <p class="text-xs uppercase tracking-widest text-gray-400 font-semibold mb-3"
               style="letter-spacing:0.12em;">
                Question ${step + 1} of ${questions.length}
            </p>
            <h2 class="font-display font-semibold mb-6"
                style="font-size:1.55rem; color:#1F4C35; line-height:1.25;">${q.q}</h2>
            <div class="space-y-3">
                ${q.options.map((o, i) => `
                    <button type="button"
                        class="quiz-opt w-full text-left px-5 py-4 rounded-xl border text-sm font-medium transition-all duration-200"
                        data-idx="${i}"
                        style="border-color:${saved && saved.idx === i ? '#1F4C35' : '#e5e7eb'};
                               background:${saved && saved.idx === i ? '#f0f7f2' : 'white'};
                               color:${saved && saved.idx === i ? '#1F4C35' : '#374151'};">
                        ${o.label}
                    </button>`).join('')}
            </div>`;
    }

    qWrap.addEventListener('click', (e) => {
        const btn = e.target.closest('.quiz-opt');
        if (!btn || !qWrap.contains(btn)) return;
        selectOption(parseInt(btn.dataset.idx, 10));
    });

    function selectOption(idx) {
        answers[step] = { scores: questions[step].options[idx].scores, idx };
        document.querySelectorAll('.quiz-opt').forEach((b, i) => {
            const sel = i === idx;
            b.style.borderColor = sel ? '#1F4C35' : '#e5e7eb';
            b.style.background  = sel ? '#f0f7f2' : 'white';
            b.style.color       = sel ? '#1F4C35' : '#374151';
        });
    }

    function openQuiz() {
        step    = 0;
        answers = [];
        overlay.style.setProperty('display', 'flex', 'important');
        showQuestion();
    }

    function closeQuiz() {
        overlay.style.setProperty('display', 'none', 'important');
    }

    function computeResults() {
        const faceScores = { balance: 0, harmonic: 0, renewal: 0, timeless: 0 };

        answers.forEach(a => {
            if (!a) return;
            Object.entries(a.scores).forEach(([k, v]) => {
                if (k in faceScores) faceScores[k] += v;
            });
        });

        pendingFaceKey = Object.entries(faceScores).sort((a, b) => b[1] - a[1])[0][0];
    }

    function renderResult() {
        const face = faceProducts[pendingFaceKey];

        document.getElementById('resultName').textContent      = face.name;
        document.getElementById('resultTagline').textContent   = face.tagline;
        document.getElementById('resultDesc').textContent      = face.desc;
        document.getElementById('resultImg').src               = face.img;
        document.getElementById('resultFacePrice').textContent = face.price;

        leadOverlay.style.setProperty('display', 'none', 'important');
        resultScreen.style.setProperty('display', 'flex', 'important');
    }

    function showResult() {
        computeResults();
        overlay.style.setProperty('display', 'none', 'important');
        leadOverlay.style.setProperty('display', 'flex', 'important');
    }

    nextBtn.addEventListener('click', () => {
        if (!answers[step]) {
            const btns = qWrap.querySelectorAll('.quiz-opt');
            btns[0].style.borderColor = '#f87171';
            setTimeout(() => btns[0].style.borderColor = '#e5e7eb', 600);
            return;
        }
        if (step < questions.length - 1) {
            step++;
            showQuestion();
        } else {
            showResult();
        }
    });

    prevBtn.addEventListener('click', () => {
        if (step > 0) { step--; showQuestion(); }
    });

    document.getElementById('closeQuiz').addEventListener('click', closeQuiz);
    document.getElementById('closeResult').addEventListener('click', () => {
        resultScreen.style.setProperty('display', 'none', 'important');
    });

    document.getElementById('retakeBtn').addEventListener('click', () => {
        resultScreen.style.setProperty('display', 'none', 'important');
        openQuiz();
    });

    document.getElementById('shopBtn').addEventListener('click', () => {
        const face = faceProducts[pendingFaceKey];
        if (!face) return;
        let items = [];
        try { items = JSON.parse(localStorage.getItem('euphorielBundle')) || []; }
        catch (e) { items = []; }
        items.push({ name: face.name, img: face.img, price: face.price });
        localStorage.setItem('euphorielBundle', JSON.stringify(items));
    });

    document.getElementById('skipLeadBtn').addEventListener('click', renderResult);

    document.getElementById('leadForm').addEventListener('submit', (e) => {
        e.preventDefault();
        renderResult();
    });

    document.getElementById('startQuizBtn').addEventListener('click', openQuiz);
</script>

</body>
</html>
